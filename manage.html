<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage menu | Salt & Smoke</title>
  <!-- External dependency: Bootstrap CSS CDN (https://getbootstrap.com/docs/5.3/getting-started/introduction/) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-4 py-3">
    <a class="navbar-brand text-primary" href="index.html">Salt &amp; Smoke</a>
    <a class="btn btn-outline-light" href="index.html">Back to website</a>
  </nav>
  <main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <p class="text-primary fw-bold mb-1">RESTAURANT DATA</p>
        <h1>Menu management</h1>
        <p class="text-muted mb-0">Create, find, edit, and delete menu records stored in SQLite.</p>
      </div>
      <button id="newItemButton" class="btn btn-primary">New menu item</button>
    </div>
    <div id="manageFeedback" class="alert d-none" role="alert" aria-live="polite"></div>
    <div class="row g-4">
      <section class="col-lg-5">
        <form id="menuForm" class="card card-body shadow-sm">
          <h2 class="h4 mb-3">Menu record</h2>
          <input type="hidden" id="itemId">
          <label class="form-label" for="itemName">Name</label>
          <input class="form-control mb-3" id="itemName" required>
          <label class="form-label" for="itemCategory">Category</label>
          <input class="form-control mb-3" id="itemCategory" placeholder="dinner" required>
          <label class="form-label" for="itemDescription">Description</label>
          <textarea class="form-control mb-3" id="itemDescription" rows="3"></textarea>
          <label class="form-label" for="itemPrice">Price</label>
          <input class="form-control mb-3" id="itemPrice" type="number" min="0" step="0.01" required>
          <label class="form-check mb-3">
            <input class="form-check-input" id="itemChefPick" type="checkbox">
            <span class="form-check-label">Chef's pick</span>
          </label>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save record</button>
            <button class="btn btn-outline-secondary" id="cancelButton" type="button">Clear</button>
          </div>
        </form>
      </section>
      <section class="col-lg-7">
        <div class="card card-body shadow-sm">
          <label class="form-label" for="searchItems">Find menu records</label>
          <input class="form-control mb-3" id="searchItems" placeholder="Search by name or category">
          <div id="menuList" class="list-group"></div>
        </div>
      </section>
    </div>
  </main>
  <script src="manage.js"></script>
</body>
</html>
