<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fire_Restaurant Reservations{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111827; color: #f1f5f9; }
        .card { background: #1f2937; border-color: #374151; color: #f1f5f9; }
        .form-control, .form-select { background-color: #fff; }
        .table { --bs-table-bg: transparent; --bs-table-color: #f1f5f9; }
        .text-muted { color: #cbd5e1 !important; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-black">
    <div class="container">
        <a class="navbar-brand" href="/">Fire_Restaurant</a>
        {% if request.user.is_authenticated %}
            <div class="d-flex align-items-center gap-3">
                <a class="link-light" href="{% url 'reservation-dashboard' %}">My reservations</a>
                <form method="post" action="{% url 'customer-logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
                </form>
            </div>
        {% else %}
            <div class="d-flex gap-3">
                <a class="link-light" href="{% url 'customer-login' %}">Log in</a>
                <a class="link-light" href="{% url 'customer-register' %}">Register</a>
            </div>
        {% endif %}
    </div>
</nav>
<main class="container py-5">
    {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
