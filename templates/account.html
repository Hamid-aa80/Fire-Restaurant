<!DOCTYPE html>
<html lang="en">

{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Salt & Smoke</title>
    <link rel="icon" href="{% static 'assets/img/favicon.svg' %}" type="image/svg+xml">
    <!-- External dependency: Bootstrap CSS CDN (https://getbootstrap.com/docs/5.3/getting-started/introduction/) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- External dependency: Font Awesome icon library CDN (https://fontawesome.com/) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <div class="container-xxl position-relative p-0 ">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 py-lg-0 wow fadeIn"
            data-wow-delay="0.1s">
            <a class="navbar-brand p-0 wow fadeIn" data-wow-delay="0.1s" href="/">
                <h1 class="text-primary m-0"><i class="fa-solid fa-utensils me-3 "></i>Salt & Smoke</h1>
            </a>
            <button class="navbar-toggler wow fadeIn" data-wow-delay="0.1s" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="fa-solid fa-bars"></span>
            </button>
            <div class="collapse navbar-collapse wow fadeIn" data-wow-delay="0.1s" id="navbarCollapse">
                <div class="navbar-nav ms-auto py-0 pe-4 wow fadeIn" data-wow-delay="0.1s">
                    <a href="/" class="nav-item nav-link">Home</a>
                    <a href="/#reservation" class="nav-item nav-link">Reservation</a>
                    <a href="/account/" class="nav-item nav-link active">My Account</a>
                </div>
            </div>
        </nav>
    </div>

    <div class="container-xxl py-5 bg-dark hero-header mb-5 wow fadeIn" data-wow-delay="0.1s">
        <div class="container my-5 py-5 px-lg-5 px-sm-5 px-0">
            <div class="row align-items-center g-5 wow fadeIn">
                <div class="col-lg-12 text-center text-lg-start">
                    <h1 class="display-4 text-white animated slideInLeft">My Account</h1>
                    <p class="text-white animated slideInLeft mb-0 pb-2">Sign up or log in to reserve a table and manage
                        your bookings.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="container-xxl py-5">
        <div class="container">
            <div id="authFeedback" class="alert d-none" role="alert" aria-live="polite" aria-atomic="true"></div>

            <!-- Shown when the visitor is not logged in -->
            <div id="authForms" class="row g-4 justify-content-center">
                <div class="col-lg-5">
                    <div class="card card-body shadow-sm h-100">
                        <h2 class="h4 mb-3">Sign Up</h2>
                        <form id="signupForm" novalidate>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="signupName" placeholder="Your Name"
                                    required minlength="2">
                                <label for="signupName">Your Name</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="signupEmail" placeholder="Your Email"
                                    required>
                                <label for="signupEmail">Your Email</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="signupPassword" placeholder="Password"
                                    required minlength="6">
                                <label for="signupPassword">Password (min 6 characters)</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3">Create Account</button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card card-body shadow-sm h-100">
                        <h2 class="h4 mb-3">Log In</h2>
                        <form id="loginForm" novalidate>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="loginEmail" placeholder="Your Email"
                                    required>
                                <label for="loginEmail">Your Email</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="loginPassword" placeholder="Password"
                                    required>
                                <label for="loginPassword">Password</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3">Log In</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Shown when the visitor is logged in -->
            <div id="accountDashboard" class="d-none">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div>
                        <p class="text-primary fw-bold mb-1">WELCOME BACK</p>
                        <h2 class="mb-0" id="accountGreeting">Hello!</h2>
                    </div>
                    <button id="logoutButton" class="btn btn-outline-danger">Log Out</button>
                </div>

                <div class="row g-4">
                    <div class="col-lg-5">
                        <div class="card card-body shadow-sm">
                            <h3 class="h5 mb-3">Reserve A Table</h3>
                            <form id="myReservationForm" novalidate>
                                <div class="form-floating mb-3">
                                    <input type="date" class="form-control" id="myReservationDate" required>
                                    <label for="myReservationDate">Select Date</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input type="time" class="form-control" id="myReservationTime" value="19:30"
                                        required>
                                    <label for="myReservationTime">Select Time</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <select class="form-select" id="myReservationGuests" required>
                                        <option value="" selected disabled>Select guests</option>
                                        <option value="1">1 person</option>
                                        <option value="2">2 people</option>
                                        <option value="3">3 people</option>
                                        <option value="4">4 people</option>
                                        <option value="5">5 people</option>
                                        <option value="6">6 people</option>
                                    </select>
                                    <label for="myReservationGuests">Select Guests</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <textarea class="form-control" id="myReservationRequests"
                                        placeholder="Special Request" style="height: 100px"></textarea>
                                    <label for="myReservationRequests">Special Request</label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-3">Book A Table</button>
                            </form>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <div class="card card-body shadow-sm">
                            <h3 class="h5 mb-3">My Reservations</h3>
                            <div id="myReservationsList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="{% static 'account.js' %}"></script>
</body>

</html>
